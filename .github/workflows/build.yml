# Automatyczne budowanie PilotDesk.exe na serwerach GitHuba (za darmo).
# Gotowy plik: zakładka Actions -> ostatnie uruchomienie -> Artifacts -> PilotDesk-windows.
# Po wypchnięciu taga (np. v2.0) plik trafia też do zakładki Releases.
name: Build PilotDesk.exe
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: PilotDesk-windows
          path: |
            dist/PilotDesk.exe
            dist/PilotDesk.exe.sha256
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PilotDesk.exe
            dist/PilotDesk.exe.sha256
