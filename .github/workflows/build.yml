# Automatyczne budowanie i publikowanie PilotDesk.exe na serwerach GitHuba (za darmo).
#
# Każdy push na gałąź main:
#   1. buduje PilotDesk.exe (+ sumę kontrolną PilotDesk.exe.sha256),
#   2. publikuje wydanie „v<VERSION>” w zakładce Releases (VERSION z pliku pd_common.py).
# Programy na Twoich komputerach pobierają nową wersję, gdy VERSION wzrośnie.
name: Build PilotDesk.exe
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Odczytaj wersję
        id: ver
        shell: bash
        run: |
          v=$(python -c "import re;print(re.search(r'^VERSION = \"(.+?)\"', open('pd_common.py', encoding='utf-8').read(), re.M).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Wersja: $v"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python build_exe.py
        timeout-minutes: 20
      - name: Autotest PilotDesk.exe
        shell: bash
        timeout-minutes: 5
        run: |
          set +e
          ./dist/PilotDesk.exe --selftest selftest.json; code=$?
          cat selftest.json
          echo "kod wyjścia: $code"
          exit $code
      - name: Dziennik błędów (gdy autotest się nie uda)
        if: failure()
        shell: bash
        run: cat "$LOCALAPPDATA/PilotDesk/error.log" || true
      - uses: actions/upload-artifact@v4
        with:
          name: PilotDesk-windows
          path: |
            dist/PilotDesk.exe
            dist/PilotDesk.exe.sha256
      - name: Lista zmian dla tej wersji
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import re
          v = "${{ steps.ver.outputs.version }}"
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## " + re.escape(v) + r"\s*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          notes = (m.group(1).strip() if m else "Poprawki i ulepszenia.")
          notes += "\n\n**Instalacja:** pobierz PilotDesk.exe, uruchom i kliknij „Zainstaluj”. Zainstalowane programy zaktualizują się same."
          open("release_notes.md", "w", encoding="utf-8").write(notes)
          print(notes)
          PY
      - name: Opublikuj wydanie
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PilotDesk ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: release_notes.md
          files: |
            dist/PilotDesk.exe
            dist/PilotDesk.exe.sha256
